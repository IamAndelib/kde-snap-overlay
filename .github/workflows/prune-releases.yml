name: Prune old releases

# One-off maintenance: deletes every release (and its tag) except the one for
# the current metadata.json version. Manual only, and it refuses to run
# unless that current release is already published.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete" to remove every release and its tag except the current version'
        required: true

permissions:
  contents: write

jobs:
  prune:
    if: inputs.confirm == 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete all releases except the current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="v$(jq -r '.KPlugin.Version' metadata.json)"
          if ! gh release view "$keep" >/dev/null 2>&1; then
            echo "::error::$keep is not published; refusing to prune"
            exit 1
          fi
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$keep" ] && continue
            echo "Deleting release and tag $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
          echo "Remaining releases:"
          gh release list
